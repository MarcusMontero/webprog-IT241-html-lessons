<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Intro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    overflow: hidden;
    height: 100vh;
}

/* Intro Screen */
#intro-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* Sand Text */
.sand-text {
    font-size: 3rem;
    font-weight: bold;
    color: #f4e4c1;
    text-align: center;
}

.sand-letter {
    opacity: 0;
    display: inline-block;
}

.sand-letter.build {
    animation: sandBuild 0.8s forwards;
}

@keyframes sandBuild {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.5);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* Button */
.proceed-btn {
    margin-top: 3rem;
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    background: transparent;
    color: white;
    border: 2px solid white;
    border-radius: 50px;
    cursor: pointer;
    opacity: 0;
}

.proceed-btn.show {
    opacity: 1;
}

/* Wave */
.wave-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.wave {
    position: absolute;
    bottom: -100%;
    width: 200%;
    height: 100%;
    background: linear-gradient(#3b82f6, #1e3a8a);
    border-radius: 50%;
    animation: waveUp 2s forwards;
}

@keyframes waveUp {
    to {
        bottom: 0;
    }
}

.sand-letter.wash {
    animation: wash 0.6s forwards;
}

@keyframes wash {
    to {
        opacity: 0;
        transform: translateY(80px);
        filter: blur(10px);
    }
}
</style>
</head>

<body>

<div id="intro-screen">
    <div class="sand-text" id="sandText"></div>
    <button class="proceed-btn" id="proceedBtn">Proceed</button>
    <div class="wave-container" id="waveContainer"></div>
</div>

<script>
const welcomeText = "Welcome to my website";
const sandText = document.getElementById("sandText");
const proceedBtn = document.getElementById("proceedBtn");
const waveContainer = document.getElementById("waveContainer");

// Build text
welcomeText.split("").forEach((char, i) => {
    const span = document.createElement("span");
    span.className = "sand-letter";
    span.innerHTML = char === " " ? "&nbsp;" : char;
    sandText.appendChild(span);

    setTimeout(() => {
        span.classList.add("build");
        if (i === welcomeText.length - 1) {
            proceedBtn.classList.add("show");
        }
    }, i * 100);
});

// Button click
proceedBtn.addEventListener("click", () => {
    proceedBtn.style.pointerEvents = "none";

    const wave = document.createElement("div");
    wave.className = "wave";
    waveContainer.appendChild(wave);

    document.querySelectorAll(".sand-letter").forEach((l, i) => {
        setTimeout(() => l.classList.add("wash"), i * 40);
    });

    // 🔥 REDIRECT AFTER ANIMATION
    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
});
</script>

</body>
</html>
